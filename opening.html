<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <!-- 讓網頁適應不同裝置的螢幕尺寸 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Opening</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
   <!-- 黑幕背景雨聲音效 -->
<audio id="rainSound" autoplay loop>

    <!-- 雨聲音效的檔案路徑 -->
    <source src="Images/Audio/rain2.mp3" type="audio/mpeg">

</audio>

    <div class="opening-page">

        <div class="opening-text">
            <p>十多年前——</p>
            <p>早晨七點的雄英高中，天空下著細雨。</p>

            <p>又是一天普通的上學日。</p>
            <p>習慣提早到校的我聽著窗外連綿不絕的雨聲。</p>
            <p>教室尚未迎來往日的喧囂。</p>
            <p>一切都和平時沒有什麼不同。</p>
            <p>...</p>

        </div>

        <a href="prologue.html" class="opening-next">
            next ▸
        </a>

    </div>
<script>

    // 取得雨聲音效
    const rain = document.getElementById("rainSound");

    // 設定雨聲音量為40%
    rain.volume = 0.4;

    // 嘗試在黑幕出現時自動播放雨聲
    rain.play().catch(() => {

        document.addEventListener("click", () => {
            rain.play();
        }, { once: true });

    });

</script>
<!-- 點擊滑鼠逐句顯示開場文字 -->
<script>
    const lines = document.querySelectorAll(".opening-text p");
    const nextButton = document.querySelector(".opening-next");

    document.addEventListener("click", function () {

        // 尋找下一句尚未完整顯示的文字
        for (let line of lines) {

            if (parseFloat(getComputedStyle(line).opacity) < 1) {
                line.classList.add("show-now");
                return;
            }

        }

        // 所有文字顯示完畢後，顯示下一頁按鈕
        nextButton.classList.add("show-now");

    });
</script>
</body>

</html>
